name: sync-guidelines

# Copied from pkgforge-apps/.github by scripts/sync-guidelines.sh, which
# also pins the shared workflow below to the revision it synced from.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: sync-guidelines
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    uses: pkgforge-apps/.github/.github/workflows/app-sync-guidelines.yml@ecfeba163ab26755d06c0bf22646baec50758cf4
    permissions:
      contents: write
      pull-requests: write
      actions: write
